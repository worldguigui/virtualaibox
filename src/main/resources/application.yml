server:
  port: 8080

spring:
  config:
    import:
      - optional:classpath:default.yml   # 默认配置，降级处理
      - optional:classpath:secrets.yml   # 本地私密配置

  application:
    name:
      VirtualAIBox

  virtual-clock:
    # 时间刻度
    tick: 0
    # 时间步长
    interval: 30
    # 元时间：虚拟时钟的起始时间
    meta-instant: 2026-06-03T00:00:00+08:00

virtual-ai-box:
  world:
    name: VirtualAIBox Town
    width: 37
    height: 37
    rules:
      movement: true
      socialInteraction: true
      itemSpawning: true
      combat: false
      trading: false
    items: []
    default-residents:
      - name: Alice
        x: 6
        y: 2
      - name: Bob
        x: 18
        y: 17

langchain4j:
  open-ai:
    chat-model:
      base-url: ${llm.${llm.provider}.base-url}
      api-key: ${llm.${llm.provider}.api-key}
      model-name: ${llm.${llm.provider}.model-name}
      log-responses: false
      log-requests: false


