server:
  port: 8080

spring:
  config:
    import:
      - optional:classpath:secrets.yml

  application:
    name:
      VirtualAIBox

  virtual-clock:
    # 时间刻度
    tick: 0
    # 时间步长
    interval: 30
    # 元时间：虚拟时钟的起始时间
    meta-instant: 2026-06-03T00:00:00+08:00

virtual-ai-box:
  world:
    name: VirtualAIBox Town
    world-description: "一个居民会探索、交流、收集资源并完成任务的小镇。优先遵守世界规则，保护自身和社区。"
    width: 37
    height: 37
    rules:
      movement: true
      socialInteraction: true
      itemSpawning: true
      combat: false
      trading: false
    items:
      - id: berry
        name: 野浆果
        type: food
        max-count: 12
        spawn-weight: 5
        description: 恢复体力的食物
      - id: wood
        name: 木材
        type: material
        max-count: 12
        spawn-weight: 3
        description: 建造和交易材料
    default-residents:
      - name: Alice
        x: 6
        y: 2
      - name: Bob
        x: 18
        y: 17

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${secrets.apikey.deepseek}
      model-name: deepseek-chat
      log-responses: false
      log-requests: false
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${secrets.apikey.deepseek}
      model-name: deepseek-chat
      log-responses: false
      log-requests: false


